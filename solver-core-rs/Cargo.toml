[package]
name = "solver_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "solver_core"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
ahash = "0.8"
rand = "0.8"
thiserror = "1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip= "symbols"
